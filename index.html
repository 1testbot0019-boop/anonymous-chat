<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Anonymous room chat with optional names and peer-to-peer voice calling."><title>Anonymous Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f172a;color:#e5e7eb;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:20px}.app{width:100%;max-width:760px;margin:auto;background:#020617;border:1px solid #1e293b;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}header{padding:22px;border-bottom:1px solid #1e293b}h1,h2{margin:0}h1{font-size:24px}p{color:#94a3b8;margin:8px 0 0}.panel{padding:22px}.hidden{display:none!important}label{display:block;margin-top:14px;font-size:14px;color:#cbd5e1}input,button{width:100%;padding:13px;border-radius:9px;font-size:15px}input{margin-top:7px;background:#0f172a;color:#fff;border:1px solid #334155;outline:none}input:focus{border-color:#38bdf8}button{margin-top:12px;border:0;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}button.secondary{background:#1e293b;color:#e5e7eb}button.danger{background:#7f1d1d;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:13px;color:#64748b}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.room{color:#38bdf8;font-weight:700}.status{font-size:13px;color:#94a3b8;margin-bottom:12px;min-height:18px}.messages{height:420px;overflow-y:auto;background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:14px}.msg{padding:8px 10px;margin-bottom:8px;background:#111827;border-radius:8px;word-break:break-word}.name{color:#38bdf8;font-weight:700}.time{color:#64748b;font-size:11px;margin-left:8px}.composer{display:flex;gap:8px;margin-top:10px}.composer input{margin-top:0;flex:1}.composer button{width:110px;margin-top:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{margin-top:10px}.notice{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:10px;font-size:13px;color:#cbd5e1;margin-top:12px}@media(max-width:600px){.panel{padding:15px}.messages{height:50vh}.composer{flex-direction:column}.composer button{width:100%}}
</style>
</head>
<body><div class="app">
<header><h1>Anonymous Chat</h1><p>Join a room, choose a name if you want, and chat anonymously.</p></header>
<section id="joinPanel" class="panel"><h2>Join a Room</h2>
<label for="roomCode">Room code</label><input id="roomCode" maxlength="80" autocomplete="off" placeholder="Enter room code" autofocus>
<label for="displayName">Your name <span class="hint">(optional)</span></label><input id="displayName" maxlength="30" autocomplete="off" placeholder="Leave blank to use Bot1, Bot2, Bot3...">
<button id="joinButton">Join Chat</button><div id="joinStatus" class="notice">Name is optional. Blank names receive Bot1, Bot2, Bot3 and so on automatically.</div></section>
<section id="chatPanel" class="panel hidden"><div class="topbar"><div><h2>Chat Room</h2><div class="room" id="roomTitle"></div></div><div id="identity" class="room"></div></div>
<div id="status" class="status">Connecting...</div><div id="messages" class="messages"></div>
<div class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Type a message..."><button id="sendButton">Send</button></div>
<div class="actions"><button id="callButton" class="secondary">Start Voice Call</button><button id="endButton" class="danger" disabled>End Call</button></div><audio id="remoteAudio" autoplay playsinline></audio></section>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDhcvCrgzvm2Gjia_-JfUX0k_7KSdbMvU",authDomain:"anonymous-chat-eb680.firebaseapp.com",databaseURL:"https://anonymous-chat-eb680-default-rtdb.firebaseio.com",projectId:"anonymous-chat-eb680",storageBucket:"anonymous-chat-eb680.appspot.com",messagingSenderId:"747757674736",appId:"1:747757674736:web:f5392922560b317ccce235"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const SIGNALING_URL="https://anonymous-chat1-qjem.onrender.com";const socket=io(SIGNALING_URL,{transports:["websocket","polling"],reconnection:true});
let room="",userId="",displayName="",pc=null,localStream=null,pendingIce=[],messageRef=null;
const $=id=>document.getElementById(id);function status(t){$("status").textContent=t}function cleanRoom(v){return v.trim().replace(/[.#$\\[\\]/]/g,"_")}function cleanName(v){return v.trim().replace(/[<>]/g,"").slice(0,30)}
function addMessage(m){const d=document.createElement("div");d.className="msg";const n=document.createElement("span");n.className="name";n.textContent=(m.user||"Bot")+": ";d.appendChild(n);d.appendChild(document.createTextNode(m.text||""));const tm=document.createElement("span");tm.className="time";if(m.time)tm.textContent=new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});d.appendChild(tm);$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight)}
async function assignBotName(){const counter=db.ref("rooms/"+room+"/botCounter");let number=0;await counter.transaction(v=>Number(v)||0).then(r=>{number=r.snapshot.val()||0});return "Bot"+number}
async function joinRoom(){const raw=$("roomCode").value;if(!raw.trim()){$("joinStatus").textContent="Please enter a room code.";return}room=cleanRoom(raw);displayName=cleanName($("displayName").value);userId=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);try{if(!displayName)displayName=await assignBotName();const member=db.ref("rooms/"+room+"/members/"+userId);await member.set({name:displayName,joinedAt:firebase.database.ServerValue.TIMESTAMP});member.onDisconnect().remove();messageRef=db.ref("rooms/"+room+"/messages");messageRef.limitToLast(100).on("child_added",s=>{const m=s.val();if(m&&m.text)addMessage(m)},e=>status("Chat error: "+e.message));$("joinPanel").classList.add("hidden");$("chatPanel").classList.remove("hidden");$("roomTitle").textContent="Room: "+room;$("identity").textContent="You: "+displayName;socket.emit("join",room);status("Joined room. Ready to chat.")}catch(e){console.error(e);$("joinStatus").textContent="Could not join room: "+e.message)}}
function sendMessage(){const text=$("messageInput").value.trim();if(!messageRef||!text)return;messageRef.push({user:displayName,text:text.slice(0,2000),time:Date.now()}).then(()=>$("messageInput").value="").catch(e=>status("Message failed: "+e.message))}
async function createPeer(){if(pc)return pc;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]});pc.ontrack=e=>{if(e.streams[0])$("remoteAudio").srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)socket.emit("ice",{room,candidate:e.candidate})};pc.onconnectionstatechange=()=>{if(pc)status("Voice call: "+pc.connectionState)};return pc}
async function startCall(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("Microphone requires HTTPS or localhost.");localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});await createPeer();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));const offer=await pc.createOffer();await pc.setLocalDescription(offer);socket.emit("offer",{room,offer:pc.localDescription});$("callButton").disabled=true;$("endButton").disabled=false;status("Calling... waiting for another participant.")}catch(e){status("Call failed: "+e.message);stopCall()}}
async function handleOffer(d){if(d?.room!==room)return;try{if(!localStream)localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});await createPeer();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));await pc.setRemoteDescription(d.offer);for(const c of pendingIce.splice(0))await pc.addIceCandidate(c).catch(console.warn);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit("answer",{room,answer:pc.localDescription});$("callButton").disabled=true;$("endButton").disabled=false;status("Voice call connected.")}catch(e){status("Incoming call failed: "+e.message)}}
socket.on("connect",()=>{if(room)socket.emit("join",room)});socket.on("connect_error",()=>{if(room)status("Signaling server unavailable. Chat can still work.")});socket.on("offer",handleOffer);socket.on("answer",async d=>{if(!pc||d?.room!==room)return;try{await pc.setRemoteDescription(d.answer);for(const c of pendingIce.splice(0))await pc.addIceCandidate(c).catch(console.warn);status("Voice call connected.")}catch(e){status("Call connection failed: "+e.message)}});socket.on("ice",async d=>{if(d?.room!==room||!d.candidate)return;const c=new RTCIceCandidate(d.candidate);if(pc?.remoteDescription)await pc.addIceCandidate(c).catch(console.warn);else pendingIce.push(c)});
function stopCall(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(pc){pc.close();pc=null}pendingIce=[];$("remoteAudio").srcObject=null;$("callButton").disabled=false;$("endButton").disabled=true;status("Call ended.")}
$("joinButton").onclick=joinRoom;$("sendButton").onclick=sendMessage;$("callButton").onclick=startCall;$("endButton").onclick=stopCall;$("roomCode").onkeydown=e=>{if(e.key==="Enter")$("displayName").focus()};$("displayName").onkeydown=e=>{if(e.key==="Enter")joinRoom()};$("messageInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};
</script></body></html>
