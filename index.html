<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Anonymous room chat with optional names and peer-to-peer voice calling.">
<title>Anonymous Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f172a;color:#e5e7eb;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:20px}.app{width:100%;max-width:760px;margin:auto;background:#020617;border:1px solid #1e293b;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}header{padding:22px;border-bottom:1px solid #1e293b}h1,h2{margin:0}h1{font-size:24px}p{color:#94a3b8;margin:8px 0 0}.panel{padding:22px}.hidden{display:none!important}label{display:block;margin-top:14px;font-size:14px;color:#cbd5e1}input,button{width:100%;padding:13px;border-radius:9px;font-size:15px}input{margin-top:7px;background:#0f172a;color:#fff;border:1px solid #334155;outline:none}input:focus{border-color:#38bdf8}button{margin-top:12px;border:0;background:#38bdf8;color:#082f49;font-weight:700;cursor:pointer}button.secondary{background:#1e293b;color:#e5e7eb}button.danger{background:#7f1d1d;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:13px;color:#64748b}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.room{color:#38bdf8;font-weight:700}.status{font-size:13px;color:#94a3b8;margin-bottom:12px;min-height:18px}.messages{height:420px;overflow-y:auto;background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:14px}.msg{padding:8px 10px;margin-bottom:8px;background:#111827;border-radius:8px;word-break:break-word}.name{color:#38bdf8;font-weight:700}.time{color:#64748b;font-size:11px;margin-left:8px}.system{color:#64748b;font-size:12px;padding:5px 10px;text-align:center}.composer{display:flex;gap:8px;margin-top:10px}.composer input{margin-top:0;flex:1}.composer button{width:110px;margin-top:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{margin-top:10px}.notice{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:10px;font-size:13px;color:#cbd5e1;margin-top:12px}@media(max-width:600px){.panel{padding:15px}.messages{height:50vh}.composer{flex-direction:column}.composer button{width:100%}}
</style>
</head>
<body>
<div class="app">
<header><h1>Anonymous Chat</h1><p>Join a room, choose a name if you want, and chat anonymously.</p></header>
<section id="joinPanel" class="panel">
<h2>Join a Room</h2>
<label for="roomCode">Room code</label><input id="roomCode" maxlength="80" autocomplete="off" placeholder="Enter room code" autofocus>
<label for="displayName">Your name <span class="hint">(optional)</span></label><input id="displayName" maxlength="30" autocomplete="off" placeholder="Leave blank to use Bot1, Bot2, Bot3...">
<button id="joinButton">Join Chat</button>
<div id="joinStatus" class="notice">Name is optional. Blank names automatically receive Bot1, Bot2, Bot3 and so on.</div>
</section>
<section id="chatPanel" class="panel hidden">
<div class="topbar"><div><h2>Chat Room</h2><div class="room" id="roomTitle"></div></div><div id="identity" class="room"></div></div>
<div id="status" class="status">Connecting...</div>
<div id="messages" class="messages"></div>
<div class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Type a message..."><button id="sendButton">Send</button></div>
<div class="actions"><button id="callButton" class="secondary">Start Voice Call</button><button id="endButton" class="danger" disabled>End Call</button></div>
<audio id="remoteAudio" autoplay playsinline></audio>
</section>
</div>
<script>
const SIGNALING_URL="https://anonymous-chat-42im.onrender.com";
const socket=io(SIGNALING_URL,{autoConnect:false,transports:["websocket","polling"],reconnection:true,reconnectionAttempts:20,reconnectionDelay:1000,reconnectionDelayMax:5000,timeout:10000});

let room="",displayName="",pc=null,localStream=null,pendingIce=[],joined=false,joinInProgress=false,joinTimer=null;

const $=id=>document.getElementById(id);

function setStatus(t){$("status").textContent=t}

function cleanRoom(v){
  return v.trim().replace(/[.#$\[\]/]/g,"_").slice(0,80);
}

function cleanName(v){
  return v.replace(/[<>]/g,"").trim().slice(0,30);
}

function addMessage(m){
  const d=document.createElement("div");
  d.className="msg";
  const n=document.createElement("span");
  n.className="name";
  n.textContent=(m.user||"Bot")+": ";
  d.appendChild(n);
  d.appendChild(document.createTextNode(m.text||""));
  const tm=document.createElement("span");
  tm.className="time";
  if(m.time)tm.textContent=new Date(m.time).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  d.appendChild(tm);
  $("messages").appendChild(d);
  $("messages").scrollTop=$("messages").scrollHeight;
}

function addSystem(text){
  const d=document.createElement("div");
  d.className="system";
  d.textContent=text;
  $("messages").appendChild(d);
  $("messages").scrollTop=$("messages").scrollHeight;
}

function joinRoom(){
  if(joined||joinInProgress)return;
  const raw=$("roomCode").value;
  if(!raw.trim()){
    $("joinStatus").textContent="Please enter a room code.";
    return;
  }
  room=cleanRoom(raw);
  displayName=cleanName($("displayName").value);
  if(!room){
    $("joinStatus").textContent="Please enter a valid room code.";
    return;
  }
  joinInProgress=true;
  $("joinButton").disabled=true;
  $("joinStatus").textContent="Connecting to chat server...";
  if(socket.connected) socket.emit("join",{room,name:displayName});
  else socket.connect();

  clearTimeout(joinTimer);
  joinTimer=setTimeout(()=>{
    if(!joined){
      joinInProgress=false;
      $("joinButton").disabled=false;
      $("joinStatus").textContent="Could not connect to the chat server. Please try again.";
    }
  },12000);
}

socket.on("connect",()=>{
  if(room&&!joined&&joinInProgress){
    $("joinStatus").textContent="Connected. Joining room...";
    socket.emit("join",{room,name:displayName});
  }
});

socket.on("connect_error",()=>{
  if(!joined){
    joinInProgress=false;
    clearTimeout(joinTimer);
    $("joinButton").disabled=false;
    $("joinStatus").textContent="Chat server connection failed. Please try again.";
  }else{
    setStatus("Connection interrupted. Reconnecting...");
  }
});

socket.on("disconnect",()=>{
  if(joined)setStatus("Connection interrupted. Reconnecting...");
});

socket.on("joined",data=>{
  if(!data||data.room!==room)return;
  clearTimeout(joinTimer);
  joinInProgress=false;
  displayName=data.name||"Bot";
  joined=true;

  $("joinPanel").classList.add("hidden");
  $("chatPanel").classList.remove("hidden");
  $("roomTitle").textContent="Room: "+room;
  $("identity").textContent=displayName;
  setStatus(socket.connected?"Connected":"Reconnecting...");

  $("messages").innerHTML="";
  addSystem("You joined the room as "+displayName+".");
  if(Array.isArray(data.members)&&data.members.length>1){
    addSystem(data.members.length+" people are currently in this room.");
  }
});

socket.on("join_error",msg=>{
  clearTimeout(joinTimer);
  joinInProgress=false;
  $("joinButton").disabled=false;
  $("joinStatus").textContent=msg||"Could not join room.";
});

socket.on("system",msg=>{if(joined)addSystem(msg)});

socket.on("chat",msg=>{if(joined)addMessage(msg)});

function sendMessage(){
  const text=$("messageInput").value.trim();
  if(!joined||!socket.connected||!text)return;
  socket.emit("chat",text.slice(0,2000));
  $("messageInput").value="";
  $("messageInput").focus();
}

function closePeer(){
  if(pc){
    pc.onicecandidate=null;
    pc.ontrack=null;
    pc.onconnectionstatechange=null;
    pc.close();
    pc=null;
  }
  pendingIce=[];
  $("endButton").disabled=true;
  $("callButton").disabled=false;
}

async function createPeer(){
  if(pc)return pc;
  pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"},
      {urls:"stun:stun1.l.google.com:19302"}
    ]
  });

  pc.onicecandidate=e=>{
    if(e.candidate&&room)socket.emit("ice",{room,candidate:e.candidate});
  };

  pc.ontrack=e=>{
    $("remoteAudio").srcObject=e.streams[0];
    $("remoteAudio").play().catch(()=>{});
  };

  pc.onconnectionstatechange=()=>{
    const state=pc?.connectionState;
    if(state==="connected"){
      setStatus("Voice call connected");
      $("endButton").disabled=false;
    }else if(state==="failed"){
      setStatus("Voice connection failed. Try Start Voice Call again.");
    }else if(state==="disconnected"){
      setStatus("Voice call disconnected.");
    }
  };

  if(localStream){
    localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));
  }
  return pc;
}

async function startCall(){
  if(!joined||!socket.connected)return;
  try{
    $("callButton").disabled=true;
    setStatus("Requesting microphone...");
    localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    await createPeer();
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit("offer",{room,offer:pc.localDescription});
    $("endButton").disabled=false;
    setStatus("Calling people in this room...");
  }catch(err){
    console.error(err);
    $("callButton").disabled=false;
    $("endButton").disabled=true;
    setStatus("Microphone permission is required for voice calling.");
    if(localStream){
      localStream.getTracks().forEach(t=>t.stop());
      localStream=null;
    }
  }
}

async function endCall(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream=null;
  }
  closePeer();
  $("remoteAudio").srcObject=null;
  if(joined)setStatus("Connected");
}

socket.on("offer",async data=>{
  if(!joined||!data?.offer)return;
  try{
    localStream=localStream||await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    await createPeer();
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

    for(const candidate of pendingIce){
      try{await pc.addIceCandidate(candidate)}catch(e){}
    }
    pendingIce=[];

    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit("answer",{room,answer:pc.localDescription});
    $("endButton").disabled=false;
    setStatus("Voice call connected");
  }catch(err){
    console.error(err);
    setStatus("Could not accept the voice call.");
  }
});

socket.on("answer",async data=>{
  if(!pc||!data?.answer)return;
  try{
    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    for(const candidate of pendingIce){
      try{await pc.addIceCandidate(candidate)}catch(e){}
    }
    pendingIce=[];
    setStatus("Voice call connected");
  }catch(err){
    console.error(err);
  }
});

socket.on("ice",async data=>{
  if(!data?.candidate)return;
  try{
    const candidate=new RTCIceCandidate(data.candidate);
    if(pc?.remoteDescription?.type) await pc.addIceCandidate(candidate);
    else pendingIce.push(candidate);
  }catch(err){
    console.error(err);
  }
});

$("joinButton").onclick=joinRoom;
$("sendButton").onclick=sendMessage;
$("callButton").onclick=startCall;
$("endButton").onclick=endCall;

$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

$("roomCode").addEventListener("keydown",e=>{
  if(e.key==="Enter")joinRoom();
});

$("displayName").addEventListener("keydown",e=>{
  if(e.key==="Enter")joinRoom();
});
</script>
</body>
</html>
